services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mensah_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mensah_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-mensah_rentals_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-mensah_dev} -d ${POSTGRES_DB:-mensah_rentals_dev}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  postgres-test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mensah_test
      POSTGRES_PASSWORD: mensah_test_password
      POSTGRES_DB: mensah_rentals_test
    ports:
      - '${TEST_POSTGRES_PORT:-5434}:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mensah_test -d mensah_rentals_test']
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 3s

volumes:
  postgres_data:
  postgres_test_data:
